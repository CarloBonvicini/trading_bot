name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # La versione minima dichiarata nel pyproject e l'ultima disponibile.
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          # Windows e' l'ambiente di sviluppo: il parallelismo usa "spawn" e
          # va provato proprio li'.
          - os: windows-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Installa il progetto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test (compresi i lenti)
        run: python -m pytest --lenti -q
